name: CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Installing Dependencies
              run: npm ci

            - name: Type Check
              run: npx tsc --noEmit

            - name: Build
              run: npm run build

            - name: Run Tests
              run: npm run test
